name: publish
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A tag push used to go straight to PyPI with nothing checked. Publishing is the one
  # irreversible step in this repo — a yanked release is still a released filename.
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    environment: pypi          # configure this env + a PyPI trusted publisher
    permissions:
      id-token: write          # OIDC for PyPI trusted publishing (no token needed)
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - run: uv publish --trusted-publishing always
