[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "haru-pack"
dynamic = ["version"]
description = "Pack a Python project (PEP 723 script or full project) into a single, EV-signable native launcher that stages uv + a standalone Python and runs it like a compiled binary."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "ShyftXero" }]
keywords = ["packaging", "uv", "pep723", "executable", "nim", "single-file", "pyinstaller", "distribution"]
dependencies = [
  "typer>=0.12",
  # Declared explicitly even though typer already requires it: `haru_pack.ui` imports rich
  # directly, and depending on a transitive dep is how a build breaks when the intermediary
  # drops it. >=13 for `Console(soft_wrap=...)` and named themes.
  "rich>=13",
  "platformdirs>=4",
  "tomli-w>=1",
  "tomli>=2; python_version < '3.11'",
  "cryptography>=42",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Build Tools",
  "Topic :: System :: Software Distribution",
]

[project.urls]
Homepage = "https://github.com/ShyftXero/haru-pack"
Repository = "https://github.com/ShyftXero/haru-pack"
Issues = "https://github.com/ShyftXero/haru-pack/issues"

[project.scripts]
# Two real console scripts, not a shell alias: both are generated by the installer, so
# `haru` works in every environment `haru-pack` does — including a Windows install with no
# shell profile to put an alias in. The CLI reads its own name from argv[0], so the commands
# it prints back to you match whichever one you typed.
#
# Note for anyone tempted to publish `haru` as its own distribution: the NAME `haru` is
# already taken on PyPI (an unrelated web framework). Script names are per-environment, not
# global, so the command is fine; the distribution name is not available.
haru-pack = "haru_pack.cli:main"
haru = "haru_pack.cli:main"

[tool.hatch.version]
path = "src/haru_pack/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/haru_pack"]

# ship the Nim launcher source (compiled at build-time by `haru-pack build`)
[tool.hatch.build]
include = [
  "src/haru_pack/**/*.py",
  "src/haru_pack/launcher/*.nim",
  # The vendored XZ decoder is compiled by `nim c` at build time, so the C sources have to
  # be in the wheel or every launcher build fails with "xz.h: No such file or directory".
  # PROVENANCE.md ships with them deliberately: it is the audit trail for third-party C
  # that ends up inside a binary the operator signs.
  "src/haru_pack/launcher/xz/*.c",
  "src/haru_pack/launcher/xz/*.h",
  "src/haru_pack/launcher/xz/PROVENANCE.md",
  "src/haru_pack/pins.toml",
]

[tool.hatch.build.targets.sdist]
include = ["src/haru_pack", "examples", "docs", "research", "README.md", "pyproject.toml"]

[dependency-groups]
# ruff is pinned EXACTLY, and this pin is the single source of truth — CI and
# scripts/cut-release.sh both `sed` the pin out of this file and lint via `uvx "ruff@$pin"`,
# never via whatever `ruff` happens to be on PATH (INV-CI-01). `uvx` and not
# `uv run --group dev ruff`: the latter installs the linter into the project environment the
# tests then run in, so the lint step would mutate what the suite is about to measure.
#
# Why exact: ruff's DEFAULT rule set grows between releases, so an unpinned linter fails on
# code it passed yesterday with no change to the code. Measured on this tree 2026-09-11 —
# 0.15.19: clean. 0.16.6: 143 errors (I001 import sorting, PLW1510, RUF100). CI ran
# `uvx ruff check .` unpinned, downloaded the newer one, and had been red for days while the
# same commit passed the local gate. There were three different ruffs on the maintainer's
# machine alone.
#
# Bumping this is a deliberate act, not a side effect: a newer ruff may demand 100+ changes,
# and I001 in particular fights the compact grouped-import house style that [tool.ruff.lint]
# documents. Decide the rules, then bump.
dev = ["pytest>=8", "ruff==0.15.19",
       # busybody --jobs only. A dev-tool dependency: nothing haru-pack SHIPS uses
       # it, and the harness runs serially when it is absent.
       "mpire>=2.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "invariant(id): claims an entry in INVARIANTS.md. Run the contract with `pytest -m invariant`.",
  "slow: needs a real toolchain and compiles something. Skip with `-m 'not slow'`.",
]

[tool.ruff]
line-length = 110
extend-exclude = ["examples", "research"]

[tool.ruff.lint]
# The house style is compact: grouped imports and one-line guard clauses. Those are
# deliberate, so they are not errors here. What ruff is here to catch is dead code and
# real mistakes — an unused import in a security test usually means an assertion was
# deleted and nobody noticed.
ignore = ["E401", "E701", "E702", "E741"]
