# ── nim, from source ─────────────────────────────────────────────────────────
# For build hosts choosenim does not publish a binary for — linux aarch64 is the one that
# matters here (docs/adr/0005 §8, issue #32). `haru_pack.toolchain` documents the supported
# set: linux x86_64, macOS x86_64/arm64, Windows. Nothing for linux arm64.
#
# The VERSION is chosen to match what choosenim installs on the platforms it does cover, so
# an arm64 build and an amd64 build use the same compiler rather than two that merely both
# work. Bump this and CHOOSENIM's pinned toolchain together, or the two arches drift.
#
# This tarball ships `c_code/` — 11,473 prebuilt C files — and a `build.sh`, so bootstrapping
# needs no git clone and no network beyond this one verified download. `build_all.sh` is the
# script that WOULD clone csources; it is deliberately not the one used.

