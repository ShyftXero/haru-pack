# A `variant = "binary"` entry belongs here too, and is the PRIMARY path once it exists:
# linux-aarch64 Nim built from the source pinned above by `.github/workflows/nim-aarch64.yml`
# and attached to a release. It is absent today because this repository is still private, so
# an unauthenticated fetch of a release asset cannot work; until then `auto` compiles.
#
# When it is added, its `provenance` must be the WORKFLOW RUN URL, not a person. That is the
# whole difference between "a maintainer's Raspberry Pi produced this" and "here is the public
# log of the job that produced it, from the source tarball digest above".
