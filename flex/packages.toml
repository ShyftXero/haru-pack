"""

[[package]]
name = "playwright"
list = "hard_targets"
known = "playwright"
import_name = "playwright"
tier = "thick"
python = "3.12"
corner = "Ships browser binaries separately from the wheel, per OS, via `playwright install`."
expect = "bundle step; browser must be baked in and found via PLAYWRIGHT_BROWSERS_PATH"
smoke = """
from playwright.sync_api import sync_playwright
with sync_playwright() as p:
    b = p.firefox.launch()
    page = b.new_page()
    page.set_content("<h1>flex</h1>")
    assert page.inner_text("h1") == "flex"
    b.close()
print("FLEX_OK")
"""

